version: "3.9"

services:
  service_cds:
    build: .
    image: image_cds:latest
    container_name: container_cds
    environment:
      TZ: America/Chicago
    working_dir: /cds
    restart: unless-stopped
    volumes:
      - E:\DATA\ERA5_HIS_weather:/cds/data

# Remove the volumes section since we're using a bind mount now